version: 2
updates:
  # GitHub Actions are pinned to commit SHAs; Dependabot bumps SHA + version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # Single npm workspace lockfile at the root covers web, gateway and executor.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # node-cron >= 4.3 evaluates fileURLToPath(import.meta.url) at module load,
      # which crashes the esbuild CommonJS worker bundle (prod outage 2026-09-27,
      # #753). Pinned to 4.2.1 until the worker bundle is ESM or the dep is replaced.
      - dependency-name: node-cron

  # Base images are pinned by version + digest in each Dockerfile.
  - package-ecosystem: docker
    directories: [/apps/web, /apps/gateway, /apps/executor, /deploy/host-agent]
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
