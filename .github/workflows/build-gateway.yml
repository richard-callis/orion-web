name: Build ORION Gateway

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/gateway/**'
      - 'package.json'
      - 'package-lock.json'
      - '.dockerignore'
      - '.github/workflows/build-gateway.yml'
  # Version tags and manual runs also build arm64 (Raspberry Pi management
  # nodes). Pushes to main build amd64 only: arm64 runs under QEMU emulation on
  # the single x86 self-hosted runner and takes tens of minutes per image,
  # which queued every deploy behind it.
  workflow_dispatch:
    inputs:
      multiarch:
        description: 'Also build linux/arm64 (slow: QEMU emulation)'
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/orion-gateway

# A newer push supersedes an in-flight build of an older commit.
concurrency:
  group: build-gateway-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, linux, x64]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # arm64 (Raspberry Pi management nodes) is built under QEMU emulation.
      - name: Set up QEMU
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.multiarch)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          # Repo-root context so the workspace package-lock.json is enforced (npm ci).
          context: .
          file: apps/gateway/Dockerfile
          platforms: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.multiarch)) && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
