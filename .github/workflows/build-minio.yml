name: Build MinIO

# MinIO no longer publishes images, so ORION builds the server and client from
# source (deploy/minio/) at pinned releases and pushes them to GHCR. Images are
# tagged with the MinIO release, which is what docker-compose.yml pins, plus the
# commit SHA that built them.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'deploy/minio/**'
      - '.github/workflows/build-minio.yml'
  # Version tags and manual runs also build arm64 (Raspberry Pi management
  # nodes). Pushes to main build amd64 only: arm64 runs under QEMU emulation on
  # the single x86 self-hosted runner and takes tens of minutes per image,
  # which queued every deploy behind it.
  workflow_dispatch:
    inputs:
      multiarch:
        description: 'Also build linux/arm64 (slow: QEMU emulation)'
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io

# A newer push supersedes an in-flight build of an older commit.
concurrency:
  group: build-minio-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: orion-minio
            dockerfile: deploy/minio/Dockerfile
            release_arg: MINIO_RELEASE
          - image: orion-mc
            dockerfile: deploy/minio/Dockerfile.mc
            release_arg: MC_RELEASE

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned release
        id: release
        run: |
          rel=$(sed -n "s/^ARG ${{ matrix.release_arg }}=\(RELEASE\.[0-9TZ-]*\)$/\1/p" "${{ matrix.dockerfile }}" | head -1)
          if [ -z "$rel" ]; then echo "No ${{ matrix.release_arg }} default in ${{ matrix.dockerfile }}" >&2; exit 1; fi
          echo "tag=$rel" >> "$GITHUB_OUTPUT"

      # arm64 (Raspberry Pi management nodes) is built under QEMU emulation.
      - name: Set up QEMU
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.multiarch)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: deploy/minio
          file: ${{ matrix.dockerfile }}
          platforms: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.multiarch)) && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.release.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
