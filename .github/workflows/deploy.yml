name: Deploy ORION

# Single canonical deploy. Fires whenever:
#   1. Either image-build workflow completes on main (so new app code lands)
#   2. Any push to main that touches deploy/** (so compose / bootstrap / vector
#      config changes land even when no app code changed)
#   3. Manually via workflow_dispatch
#
# Concurrency=deploy-orion serializes runs so two near-simultaneous triggers
# don't race against each other on the host.
#
# Bootstrap is idempotent — re-running on every deploy is the design. It
# generates any missing secrets, enables the Vault file audit device, pulls
# images, and runs `docker compose up -d` which picks up any new services.
#
# Safety net:
#   - The image the triggering build just pushed is pinned by its commit SHA
#     (not :latest), so the deploy runs exactly what was built.
#   - A PostgreSQL dump is taken before anything changes (migrations run on
#     container start and cannot be rolled back).
#   - The deploy FAILS if ORION is not healthy within 5 minutes.
#   - Every healthy deploy records deploy/.last-good (git SHA + image digests);
#     deploy/rollback.sh returns to it. See the failure step for the runbook.

on:
  workflow_run:
    workflows: ["Build ORION Web", "Build ORION Gateway", "Build ORION Vector"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-orion
  cancel-in-progress: false

# Deploy needs no GITHUB_TOKEN privileges. It git-fetches via the host's own
# credentials and pulls images via the host's docker config; the workflow
# token is not used for either. contents: read is the conventional explicit
# minimum baseline (equivalent to the default for repos created Feb 2023+).
permissions:
  contents: read

jobs:
  deploy:
    # Skip if triggered by a failed upstream build.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux, x64]
    env:
      DEPLOY_DIR: /opt/orion/deploy
    steps:
      - name: Sync /opt/orion to origin/main
        run: |
          cd /opt/orion
          git fetch --depth 1 origin main
          git reset --hard HEAD
          git checkout -B main origin/main

      - name: Pin the image that was just built
        # Each build workflow tags its image with the commit SHA. Only the
        # triggering image has that tag; the others stay on ORION_VERSION
        # (default :latest). bootstrap.sh keeps these exports over .env values.
        env:
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          case "$RUN_NAME" in
            "Build ORION Web")     echo "ORION_WEB_VERSION=$RUN_SHA"     >> "$GITHUB_ENV" ;;
            "Build ORION Gateway") echo "ORION_GATEWAY_VERSION=$RUN_SHA" >> "$GITHUB_ENV" ;;
            "Build ORION Vector")  echo "ORION_VECTOR_VERSION=$RUN_SHA"  >> "$GITHUB_ENV" ;;
            *) echo "Not triggered by an image build — using ORION_VERSION from .env (default latest)." ;;
          esac

      - name: Pre-deploy database backup
        run: $DEPLOY_DIR/backup.sh --pre-deploy

      - name: Bootstrap and start stack
        # bootstrap.sh:
        #   - generates any missing secrets in deploy/.env (idempotent grep guards)
        #   - seeds Vault KV + SecurityConfig where applicable
        #   - enables Vault file audit device
        #   - docker compose pull + up -d (picks up new services)
        #   - creates Gitea admin + token if using bundled profile
        run: |
          cd $DEPLOY_DIR
          ./bootstrap.sh

      - name: Wait for ORION health
        # Uses the container healthchecks (orion: /api/health). Fails the job
        # on timeout — a deploy that never became healthy is not a success.
        run: |
          $DEPLOY_DIR/wait-healthy.sh orion 300
          $DEPLOY_DIR/wait-healthy.sh orion-worker 60

      - name: Record last-good deploy
        run: |
          cd $DEPLOY_DIR
          tmp=$(mktemp)
          {
            echo "GIT_SHA=$(git -C /opt/orion rev-parse HEAD)"
            echo "DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for pair in orion:ORION_WEB_VERSION gateway:ORION_GATEWAY_VERSION vector:ORION_VECTOR_VERSION; do
              svc=${pair%%:*}; var=${pair#*:}
              cid=$(docker compose -f docker-compose.yml --env-file .env ps -q "$svc" | head -1)
              [ -n "$cid" ] || continue
              digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$(docker inspect --format '{{.Image}}' "$cid")" 2>/dev/null || true)
              [ -n "$digest" ] && echo "$var=$digest"
            done
          } > "$tmp"
          mv "$tmp" .last-good
          cat .last-good

      - name: Rollback runbook
        if: failure()
        run: |
          echo "::error::Deploy failed. Nothing was rolled back automatically."
          echo "Last healthy deploy:"; cat $DEPLOY_DIR/.last-good 2>/dev/null || echo "  (none recorded)"
          echo ""
          echo "To roll back on the host (see deploy/rollback.sh header):"
          echo "  1. Images only:  $DEPLOY_DIR/rollback.sh"
          echo "  2. If a migration ran and the old code can't handle it, first restore the DB:"
          echo "       docker compose -f $DEPLOY_DIR/docker-compose.yml --env-file $DEPLOY_DIR/.env stop orion orion-worker"
          echo "       $DEPLOY_DIR/restore.sh predeploy_<timestamp>   # newest: $(ls -1t $DEPLOY_DIR/backups/postgres_predeploy_*.sql.gz 2>/dev/null | head -1)"
          echo "     then run rollback.sh."
