name: Deploy ORION

# Single canonical deploy. Fires whenever:
#   1. Either image-build workflow completes on main (so new app code lands)
#   2. Any push to main that touches deploy/** (so compose / bootstrap / vector
#      config changes land even when no app code changed)
#   3. Manually via workflow_dispatch
#
# Concurrency=deploy-orion serializes runs so two near-simultaneous triggers
# don't race against each other on the host.
#
# Bootstrap is idempotent — re-running on every deploy is the design. It
# generates any missing secrets, enables the Vault file audit device, pulls
# images, and runs `docker compose up -d` which picks up any new services.
#
# Safety net:
#   - Every ORION image is pinned to the one built for this commit's history
#     (deploy/resolve_images.py), never :latest.
#   - A PostgreSQL dump is taken before anything changes (migrations run on
#     container start and cannot be rolled back).
#   - The deploy FAILS if ORION is not healthy within 5 minutes, or the worker
#     within 6 more, or if orion, orion-worker or gateway don't stay healthy for
#     the 10 minutes after (deploy/watch-deploy.sh).
#   - Every deploy that survives that records deploy/.last-good (git SHA + image
#     digests). A failed one is rolled back to it by deploy/auto-rollback.sh
#     (deploy/rollback.sh), unless it changed database migrations: then the runbook
#     is printed. The job still ends failed; deploy/.last-rollback says what happened.

on:
  workflow_run:
    workflows: ["Build ORION Web", "Build ORION Gateway", "Build ORION Vector"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      skip_ci_check:
        description: 'Deploy even if CI has not passed on this commit (emergency only)'
        type: boolean
        default: false

concurrency:
  group: deploy-orion
  cancel-in-progress: false

# Read-only token. The deploy git-fetches with the host's own credentials and pulls
# images with its docker config; the token is used only to read workflow runs.
# contents: read is the conventional explicit minimum baseline.
permissions:
  contents: read
  # Read-only: wait-for-ci reads this commit's CI run and main's head, and the deploy
  # job whether an image build is still running.
  actions: read

jobs:
  # Merges now happen on Gitea, so CI no longer gates them before merge; it runs
  # on GitHub after github-sync pushes main. Nothing deploys until CI has passed
  # on the exact commit being deployed (platform design §5.1 step 9a). This job
  # runs on a GitHub-hosted runner so it doesn't hold the self-hosted one.
  wait-for-ci:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.ci.outputs.proceed }}
      sha: ${{ steps.ci.outputs.sha }}
    steps:
      - id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          SKIP: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_ci_check }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.request, urllib.error
          repo, sha, tok = os.environ["REPO"], os.environ["SHA"], os.environ["GH_TOKEN"]
          def done(proceed, msg, level="notice", code=0):
              print(f"::{level}::{msg}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write(f"proceed={'true' if proceed else 'false'}\nsha={sha}\n")
              sys.exit(code)
          if os.environ.get("SKIP") == "true":
              done(True, f"CI check skipped by manual dispatch for {sha[:12]}", "warning")
          def get(path):
              req = urllib.request.Request(f"https://api.github.com/repos/{repo}/{path}",
                  headers={"Authorization": f"Bearer {tok}", "Accept": "application/vnd.github+json"})
              return json.load(urllib.request.urlopen(req, timeout=30))
          deadline = time.time() + 40 * 60
          while time.time() < deadline:
              try:
                  runs = get(f"actions/workflows/ci.yml/runs?head_sha={sha}&event=push&per_page=5").get("workflow_runs", [])
                  if runs and runs[0]["status"] == "completed":
                      c = runs[0]["conclusion"]
                      if c == "success":
                          done(True, f"CI passed on {sha[:12]}")
                      if c in ("cancelled", "skipped"):
                          head = get("commits/main")["sha"]
                          if head != sha:
                              # Superseded: deploy main's head instead, once its CI passes. Nothing
                              # else may trigger a deploy for this commit's changes.
                              print(f"::notice::CI on {sha[:12]} was {c}; main has moved to {head[:12]}: deploying that")
                              sha = head
                              continue
                      done(False, f"CI on {sha[:12]} concluded {c}: not deploying", "error", 1)
                  print(f"CI on {sha[:12]}: {runs[0]['status'] if runs else 'no run yet'}, waiting")
              except (urllib.error.URLError, TimeoutError, ValueError, KeyError) as e:
                  print(f"GitHub API error ({e}); retrying")
              time.sleep(30)
          done(False, f"CI on {sha[:12]} did not finish within 40 minutes: not deploying", "error", 1)
          PY

  deploy:
    # Runs only after CI passed on the exact commit (wait-for-ci), and deploys
    # that commit, not whatever main is by then.
    needs: wait-for-ci
    if: needs.wait-for-ci.outputs.proceed == 'true'
    runs-on: [self-hosted, linux, x64]
    env:
      DEPLOY_DIR: /opt/orion/deploy
      DEPLOY_SHA: ${{ needs.wait-for-ci.outputs.sha }}
    steps:
      - name: Sync /opt/orion to the CI-verified commit
        run: |
          cd /opt/orion
          # CoreDNS config/zones are runtime state written by the setup wizard.
          # Keep the live copies across the reset (they were once tracked, so a
          # checkout would otherwise delete or revert them). --update=none: never clobber
          # files git just checked out, so tracked templates stay current.
          COREDNS_KEEP=$(mktemp -d)
          cp -a deploy/coredns/. "$COREDNS_KEEP/" 2>/dev/null || true
          # Full history (once) so ancestry between the host's commit and the
          # one being deployed is always known.
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then git fetch --unshallow origin; fi
          git fetch origin "$DEPLOY_SHA"
          git reset --hard HEAD
          # Only move forward: deploy $DEPLOY_SHA if it's the same as or newer
          # than the host's commit. If the host already has a newer commit (an
          # older deploy queued behind it), keep that tree; it passed CI when it
          # was deployed. The image pin below still applies either way.
          cur=$(git rev-parse HEAD)
          if [ "$cur" = "$DEPLOY_SHA" ] || git merge-base --is-ancestor "$cur" "$DEPLOY_SHA"; then
            git checkout -B main "$DEPLOY_SHA"
          elif git merge-base --is-ancestor "$DEPLOY_SHA" "$cur"; then
            echo "::notice::host already at newer $cur; keeping its tree"
          else
            echo "::warning::$cur and $DEPLOY_SHA have diverged (history rewritten?); deploying the CI-verified $DEPLOY_SHA"
            git checkout -B main "$DEPLOY_SHA"
          fi
          cp -a --update=none "$COREDNS_KEEP/." deploy/coredns/
          rm -rf "$COREDNS_KEEP"

      - name: Pin the images of this commit
        # Whatever triggered this run: queued deploys cancel each other, so the one
        # that runs may not be the one a build asked for. deploy/resolve_images.py
        # asks GitHub whether a build is still running, with this job's read-only
        # token (from the environment, never on a command line).
        id: pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -x /opt/orion/deploy/resolve_images.py ]; then
            # A tree from before the resolver (a build of an older commit finishing late).
            echo "::notice::this tree has no resolve_images.py; skipping it, the next deploy pins its images"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          GITHUB_ORG=$(sed -n 's/^GITHUB_ORG=//p' "$DEPLOY_DIR/.env" | tail -1 | tr -d "\"'")
          export GITHUB_ORG
          set +e
          /opt/orion/deploy/resolve_images.py > "$RUNNER_TEMP/images"
          rc=$?
          set -e
          if [ "$rc" = 3 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$rc" = 0 ] || exit "$rc"
          cat "$RUNNER_TEMP/images"
          cat "$RUNNER_TEMP/images" >> "$GITHUB_ENV"

      - name: Pre-deploy database backup
        if: steps.pins.outputs.skip != 'true'
        run: $DEPLOY_DIR/backup.sh --pre-deploy

      - name: Bootstrap and start stack
        id: bootstrap
        if: steps.pins.outputs.skip != 'true'
        # bootstrap.sh:
        #   - generates any missing secrets in deploy/.env (idempotent grep guards)
        #   - seeds Vault KV + SecurityConfig where applicable
        #   - enables Vault file audit device
        #   - docker compose pull + up -d (picks up new services)
        #   - creates Gitea admin + token if using bundled profile
        run: |
          cd $DEPLOY_DIR
          ./bootstrap.sh

      - name: Wait for ORION health
        if: steps.pins.outputs.skip != 'true'
        # Uses the container healthchecks (orion: /api/health). Fails the job
        # on timeout — a deploy that never became healthy is not a success.
        run: |
          $DEPLOY_DIR/wait-healthy.sh orion 300
          # Not healthy until its heartbeat starts (model load included, up to 4 min).
          $DEPLOY_DIR/wait-healthy.sh orion-worker 360
          # Healthy isn't enough: each must run the image pinned above (a later compose
          # command in bootstrap.sh once recreated orion from .env's previous pin), and
          # stay running. Vector is optional (bootstrap.sh tolerates it not starting):
          # a vector that isn't running is a warning, one on the wrong image an error.
          if [ -s "$RUNNER_TEMP/images" ]; then
            wrong=0
            for pair in orion:ORION_WEB_VERSION orion-worker:ORION_WEB_VERSION gateway:ORION_GATEWAY_VERSION vector:ORION_VECTOR_VERSION; do
              svc=${pair%%:*}; var=${pair#*:}; want=${!var:-}
              [ -n "$want" ] || continue
              level=error; [ "$svc" = vector ] && level=warning
              cid=$(docker compose -f "$DEPLOY_DIR/docker-compose.yml" --env-file "$DEPLOY_DIR/.env" ps -aq "$svc" | head -1)
              if [ -z "$cid" ]; then
                echo "::$level::$svc has no container"; [ "$level" = warning ] || wrong=1; continue
              fi
              image=$(docker inspect --format '{{.Config.Image}}' "$cid")
              if [ "${image##*:}" != "$want" ]; then
                echo "::error::$svc runs $image, not :$want"; wrong=1; continue
              fi
              state=$(docker inspect --format '{{.State.Status}}' "$cid")
              if [ "$state" != running ]; then
                echo "::$level::$svc is $state"; [ "$level" = warning ] || wrong=1
              fi
            done
            [ "$wrong" = 0 ]
          fi

      - name: Watch the new version
        if: steps.pins.outputs.skip != 'true'
        # 10 minutes: orion, orion-worker and gateway must stay running and healthy,
        # not be recreated or restarted, and /api/health must answer. Only a version
        # that survives this is recorded as last-good.
        run: $DEPLOY_DIR/watch-deploy.sh 600

      - name: Record last-good deploy
        if: steps.pins.outputs.skip != 'true'
        run: |
          cd $DEPLOY_DIR
          tmp=$(mktemp)
          {
            echo "GIT_SHA=$(git -C /opt/orion rev-parse HEAD)"
            echo "DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # The registry tags behind those digests, for rollback.sh to pin in .env.
            [ ! -s "$RUNNER_TEMP/images" ] || sed 's/^/TAG_/' "$RUNNER_TEMP/images"
            for pair in orion:ORION_WEB_VERSION gateway:ORION_GATEWAY_VERSION vector:ORION_VECTOR_VERSION; do
              svc=${pair%%:*}; var=${pair#*:}
              cid=$(docker compose -f docker-compose.yml --env-file .env ps -q "$svc" | head -1)
              [ -n "$cid" ] || continue
              digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$(docker inspect --format '{{.Image}}' "$cid")" 2>/dev/null || true)
              [ -n "$digest" ] && echo "$var=$digest"
            done
          } > "$tmp"
          mv "$tmp" .last-good
          cat .last-good
          # Healthy: these images are now what a compose command run by hand should use.
          [ ! -s "$RUNNER_TEMP/images" ] || ./set-image-pins.sh < "$RUNNER_TEMP/images"

      - name: Automatic rollback
        # Only when the new version was started (a failure in the pins or backup steps
        # changed nothing). Rolls the images back to deploy/.last-good unless the
        # deploy changed database migrations; either way the job stays failed.
        # Outcome is written to deploy/.last-rollback.
        if: failure() && steps.bootstrap.outcome != 'skipped'
        run: $DEPLOY_DIR/auto-rollback.sh
