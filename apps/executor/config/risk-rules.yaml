# Risk classification rules evaluated top-to-bottom. First match wins.
# tier: auto | notify | approve | escalate
#
# Patterns are matched case-insensitively (classifier.ts) and only pick the tier.
#
# "auto" and "notify" run WITHOUT human approval, so they carry extra, non-configurable
# checks in command-policy.ts — the regexes here are not the security control:
#   - the command must tokenise into argv with no shell syntax (pipes, redirects, $, globs,
#     quotes-around-operators...) and is then executed without a shell;
#   - auto: the binary must be on AUTO_BINARIES, with per-binary flag restrictions
#     (e.g. no find -exec, no ps e, no date --set, no journalctl --vacuum-*);
#   - both: no argument may resolve (after symlinks) into /proc, /sys, /dev, /run/secrets,
#     /var/run/secrets, /root, /home, /etc/shadow, /etc/sudoers... (EXECUTOR_BLOCKED_PATHS adds more);
#   - notify: interpreters and environment dumpers (env, printenv, sh, python...) are refused.
# A command that fails any of these is escalated to a human instead.

rules:
  # Escalate — data destruction / code injection
  - tier: escalate
    tool: shell_exec
    patterns:
      - 'rm\s+-rf\s+/'
      - 'mkfs'
      - 'dd\s+if='
      - ':\(\)\s*\{\s*:\|:&\s*\}'  # fork bomb
      - 'curl[^|]*\|\s*(ba)?sh'
      - 'wget[^|]*\|\s*(ba)?sh'
      - 'eval\s*["\''`\$]'
      - 'base64\s+--decode.*\|'

  # Approve — privilege, destructive write, outbound network
  - tier: approve
    tool: shell_exec
    patterns:
      - 'chmod\s+[0-7]*7[0-7][0-7]'  # world-writable
      - 'chown\s+root'
      - '\bsudo\b'
      - '\bsu\s'
      - '\brm\s'
      - '\bmv\s'
      - 'truncate'
      - 'systemctl\s+(stop|disable|kill)'
      - 'kill\s+-9'
      - 'pkill'
      - '\bcurl\b'
      - '\bwget\b'
      - '\bnc\b'
      - '\bncat\b'
      - '\bbusybox\b'
      - '\bpython[0-9.]*\b'
      - '\bperl\b'
      - '>\s*/'  # redirect to absolute path

  # Auto — known-safe read operations
  - tier: auto
    tool: shell_exec
    patterns:
      # top/htop were removed: they are interactive and only ever ran until the timeout.
      - '^(ls|cat|ps|df|du|free|uptime|hostname|date|pwd|which|find|grep|head|tail|wc|stat|id|whoami|uname|lsof|ss|netstat|journalctl|dmesg)\b'

  # file_read and system_info are auto (the FILE_READ_ALLOWLIST and blocked paths are the real control)
  - tier: auto
    tool: file_read

  - tier: auto
    tool: system_info

  # Default catch-all — an unrecognised command needs a human. ("notify" means "run now
  # and tell the room", so it must never be the default.)
  - tier: approve
    tool: ''
