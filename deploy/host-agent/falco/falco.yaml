# Falco configuration for the Orion host.
#
# This is the minimal config — uses Falco's built-in rule set
# (/etc/falco/falco_rules.yaml inside the container, shipped with the image).
# Custom rules tuned to Orion workloads (e.g., alert if gateway reads
# /root/.kube) are out of scope for Phase 2.
#
# Output: Falco POSTs JSON to Falcosidekick on port 2801 (http_output).
# Falcosidekick then forwards to the Orion webhook with retries and
# CUSTOMFIELDS injection. Falcosidekick 2.x in its default mode receives
# HTTP POSTs from Falco, not gRPC streams (gRPC output/server was removed
# from Falco entirely in 0.44.0, so this isn't a mode choice anymore).

# ── Rule files ──────────────────────────────────────────────────────────────
rules_file:
  - /etc/falco/falco_rules.yaml
  - /etc/falco/falco_rules.local.yaml

# ── Engine / driver ─────────────────────────────────────────────────────────
# modern_ebpf (CO-RE) — no probe file needed; BTF is available on this host
# at /sys/kernel/btf/vmlinux (kernel 6.8.0-124-generic, PREEMPT_DYNAMIC).
# Requires falco >= 0.40.0: Ubuntu 6.8 kernel vmlinux BTF omits the
# btf_trace_page_fault_kernel type, causing pf_kernel (tp_btf/page_fault_kernel)
# PROG_LOAD to fail EINVAL and scap_init to abort. 0.40.0 treats pf_kernel
# as optional — skipped when the BTF type is absent rather than crashing.
engine:
  kind: modern_ebpf
  modern_ebpf:
    # Default is 1 ring buffer per CPU × 8 MB. On a 32-CPU host that's 256 MB
    # locked in kernel BPF memory before Falco even starts. Setting this to 2
    # allocates 1 buffer per 2 CPUs = 16 buffers × 8 MB = 128 MB total.
    # Halves locked-memory usage while keeping per-CPU coverage adequate for
    # a lightly-loaded homelab host.
    cpus_for_each_syscall_buffer: 2

# json_output: without this, Falco's default is plain-text for ALL outputs,
# including http_output. Falcosidekick's inputs endpoint only accepts a
# structured JSON body — a plain-text POST is rejected with 400 "Please send
# a valid request body" (confirmed via packet capture + falcosidekick_inputs_total
# metrics on prod: 100% of alerts rejected, 0 accepted). This flag is load-bearing
# for the entire detection pipeline (Falco → Falcosidekick → Orion webhook →
# correlator → Warden wakeup), not a cosmetic formatting choice. It also makes
# stdout_output emit JSON instead of the human-readable one-line string — if
# ops is tailing container logs expecting the plain-text format, that changes.
json_output: true

# Falco >= 0.41 moved container metadata (container.id/name/image, used by the
# default and local rules) into the `container` plugin. Rules declare
# `required_plugin_versions: container >= 0.4.0`, so Falco refuses to start
# unless it is loaded. This file replaces the image's default falco.yaml, so
# the plugin must be declared here. It reads the Docker socket via HOST_ROOT
# (/host), which is mounted read-only in docker-compose.yml.
plugins:
  - name: container
    library_path: libcontainer.so
    init_config:
      label_max_len: 100
      with_size: false
load_plugins: [container]

# Rules no longer embed container fields in their output (0.41+). ORION's
# normalizer (apps/web/src/lib/security/normalize/falco.ts) reads
# container.name / container.image from output_fields, so append them.
append_output:
  - suggested_output: true
  - match:
      source: syscall
    extra_fields:
      - container.id
      - container.name
      - container.image

# ── Output channels ─────────────────────────────────────────────────────────
# http_output: Falco POSTs each alert to Falcosidekick which handles retries,
# CUSTOMFIELDS injection, and forwarding to the Orion webhook.
http_output:
  enabled: true
  url: http://falcosidekick:2801
  user_agent: falcosecurity/falco
  keep_alive: false

stdout_output:
  enabled: true

# gRPC output/server was removed from Falco entirely in 0.44.0 (this image
# is 0.45.0) — there is no `grpc`/`grpc_output` config schema left to set,
# so those keys are omitted rather than left in as dead config.

# webserver: liveness/readiness for the ORION host-agent — see
# apps/web/src/jobs/falco-health-poll.ts, which polls this every ~60s and
# bumps EnvironmentSourceHealth so a dead/never-started Falco process is
# distinguishable from a healthy one that simply has nothing to alert on.
webserver:
  enabled: true
  listen_port: 8765
  k8s_healthz_endpoint: /healthz

# Disable outputs we don't use.
file_output:
  enabled: false

syslog_output:
  enabled: false

# ── Other ───────────────────────────────────────────────────────────────────
metrics:
  enabled: false

priority: notice
buffered_outputs: false
output_timeout: 2000

disable_source: []
