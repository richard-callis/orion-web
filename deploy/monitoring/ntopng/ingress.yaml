# Not applied automatically — set the host to your internal domain, then kubectl apply.
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: ntopng
  namespace: monitoring
  labels:
    app: ntopng
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`ntopng.example.internal`)
      kind: Rule
      services:
        - name: ntopng
          port: 3000
          namespace: monitoring
