# SECURITY: this is a well-known default password committed to the repo.
# lib/cluster-bootstrap.ts `kubectl apply`s this file verbatim, so replacing the
# value here would just make the replacement the new shared default — and on
# existing clusters it would desync Logstash/Kibana from the password
# Elasticsearch was initialised with. The fix belongs in cluster-bootstrap.ts:
# create this Secret with a random password only if it does not exist
# (kubectl create secret generic ... ) and stop applying this file.
# Every consumer (elasticsearch, kibana, elastiflow, logstash) reads it from
# the Secret, so rotating it is: update the Secret, then the elastic user
# password in Elasticsearch, then restart the consumers.
apiVersion: v1
kind: Secret
metadata:
  name: elasticsearch-credentials
  namespace: elk
stringData:
  password: "orion-elk-default"
